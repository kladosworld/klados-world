# CodeQL code scanning (advanced setup).
#
# Languages: python (application) and actions (workflow injection / permission issues).
# Both use build-mode "none", so no build or project install is needed.
# IMPORTANT: CodeQL "default setup" must stay disabled in repository settings, otherwise
# this workflow's uploads are rejected. See docs/platform/github-settings.md.
#
# Enforced through the ruleset "code_scanning" rule rather than a status check.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for source files
        id: sources
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          # CodeQL fails when a language has no source files at all (for example, Python
          # before the application lands). Skip analysis in that case only.
          if [ "$LANGUAGE" = python ] && ! git ls-files -- '*.py' | grep -q .; then
            echo "::notice::No Python files in this revision; CodeQL Python analysis skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Initialize CodeQL
        if: steps.sources.outputs.present == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze
        if: steps.sources.outputs.present == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
