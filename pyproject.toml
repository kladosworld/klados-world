[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "klados-world"
version = "0.1.0.dev0"
description = "Application foundation for the Klados World AI society platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/kladosworld/klados-world"
Issues = "https://github.com/kladosworld/klados-world/issues"

[project.optional-dependencies]
dev = [
  "build==1.6.1",
  "pre-commit==4.7.0",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/klados_world"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "pyproject.toml", "README.md", "CHANGELOG.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
