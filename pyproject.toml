[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "klados-world"
version = "0.1.0.dev0"
description = "Klados World society application and isolated development runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "openai>=1.40,<3",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/kladosworld/klados-world"
Issues = "https://github.com/kladosworld/klados-world/issues"

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "httpx2==2.16.0",
  "pre-commit==4.5.1",
  "pyright==1.1.408",
  "pytest==9.0.3",
  "ruff==0.15.0",
  "uv==0.13.7",
  "playwright==1.64.1",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/klados_world", "arena", "tee_arena", "config"]

[tool.hatch.build.targets.sdist]
include = ["src", "arena", "tee_arena", "config", "evals", "tests", "docs", "deployment/local", "requirements-*.lock", "requirements-build.in", "pyproject.toml", "README.md", "CHANGELOG.md", ".dockerignore", "hatch_build.py"]

[tool.ruff]
force-exclude = true
extend-exclude = ["arena", "tee_arena", "tests/test_arena*.py", "tests/test_society*.py", "tests/arena_support.py", "tests/test_gateway.py", "tests/test_ledger.py", "tests/test_store.py"]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
exclude = ["arena", "tee_arena", "tests/test_arena*.py", "tests/test_society*.py", "tests/arena_support.py", "tests/test_gateway.py", "tests/test_ledger.py", "tests/test_store.py"]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
